name: Release

# Yayın hattı (README §8). Tetik: `v*` etiketi ya da elle (workflow_dispatch; varsayılan dry run).
#   verify    sürüm ve etiket eşliği, typecheck, test, build, shellcheck
#   binaries  beş platformda tek dosya ikili (Node SEA) ve duman testi
#   release   SHA256SUMS ve Homebrew formülü; dry run'da yalnız yapıt, değilse TASLAK GitHub Release
#   npm       yalnız etiketle ve --provenance ile; NPM_TOKEN yoksa ya da package.json private ise atlanır
# Taslağı yayımlamak, tap deposunu güncellemek ve npm paketini açmak kişinin kararıdır.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build, test and keep the files as workflow artifacts; no draft release"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # İkiliye gömülen Node: resmî derleme (actions/setup-node). Değişirse ikilinin çalışma zamanı değişir; CHANGELOG'a yazılır.
  BINARY_NODE_VERSION: "24"

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.BINARY_NODE_VERSION }}
          cache: npm
      - name: Version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Shellcheck install.sh
        run: shellcheck -s sh packaging/install.sh

  binaries:
    name: Binary ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # scripts/lib/release.mjs TARGETS ile aynı (test/release.test.ts denetler)
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: windows-x64
            runner: windows-2025
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.verify.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.BINARY_NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build:binary -- --expect-target "$TARGET"
      - name: Smoke test
        run: |
          bin="./dist-bin/perafly-$TARGET"
          if [ "$TARGET" = windows-x64 ]; then bin="$bin.exe"; fi
          got=$("$bin" --version)
          if [ "$got" != "$VERSION" ]; then echo "::error::$bin --version printed $got, expected $VERSION"; exit 1; fi
          "$bin" --help > /dev/null
          export PERAFLY_HOME="$RUNNER_TEMP/perafly-home"
          "$bin" profiles --json
          # Anahtar zinciri ikiliye girmez: zorlanınca açık hata, kimlik düz dosyaya (0600) yazılır
          if PERAFLY_CREDENTIAL_STORE=keyring "$bin" whoami --json 2> "$RUNNER_TEMP/err.json"; then exit 1; fi
          grep -q '"code":"credential_keyring_unavailable"' "$RUNNER_TEMP/err.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perafly-${{ matrix.target }}
          path: dist-bin/perafly-${{ matrix.target }}*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Checksums, formula, draft release
    needs: [verify, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.BINARY_NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: perafly-*
          path: dist-bin
          merge-multiple: true
      - name: SHA256SUMS
        run: npm run checksums
      - name: Homebrew formula
        run: npm run homebrew:formula
      - name: Install scripts
        run: cp packaging/install.sh packaging/install.ps1 dist-bin/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.verify.outputs.version }}
          path: dist-bin/
          if-no-files-found: error
          retention-days: 7
      - name: Draft GitHub release
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          Draft created by the release workflow. Review it, then publish it by hand.

          Verify a download before running it:
          `sha256sum -c SHA256SUMS --ignore-missing` (macOS: `shasum -a 256 -c SHA256SUMS --ignore-missing`).

          Homebrew: after publishing, copy `perafly.rb` to `Formula/perafly.rb` in the tap repository.
          Changes: see CHANGELOG.md.
          EOF
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            if [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::Release $tag is already published; its files are not replaced. Bump the version."
              exit 1
            fi
            gh release upload "$tag" dist-bin/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist-bin/* --draft --target "$GITHUB_SHA" --title "perafly $tag" \
              --notes-file "$RUNNER_TEMP/notes.md" --repo "$GITHUB_REPOSITORY"
          fi

  npm:
    name: npm publish (tag only)
    needs: [verify, release]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.BINARY_NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Check prerequisites
        id: gate
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::notice::NPM_TOKEN is not set; npm publish skipped."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$(node -p "require('./package.json').private === true")" = "true" ]; then
            echo "::notice::package.json has private: true; npm publish skipped (repository openness and license are the owner's decision)."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.publish == 'true'
        run: npm ci
      - if: steps.gate.outputs.publish == 'true'
        run: npm run build
      - name: Publish
        if: steps.gate.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
